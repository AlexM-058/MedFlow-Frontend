<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Reteta sintetica MedFlow pentru demonstratie</title>
  <desc id="desc">Ana Test, Amlodipina 5 mg, 1 cp dimineata, 30 zile. Date fictive, nu este o prescriptie medicala.</desc>
  <rect width="900" height="1100" fill="white"/>
  <g fill="#18232f" font-family="Arial, sans-serif">
    <text x="70" y="100" font-size="32" font-weight="bold">RETETA SINTETICA</text>
    <text x="70" y="155" font-size="22">Exclusiv pentru testarea interfetei</text>
    <text x="70" y="195" font-size="22">Nu este o prescriptie. Nu se utilizeaza medical.</text>
    <path d="M70 230H830" stroke="#18232f" stroke-width="2"/>
    <text x="70" y="295" font-size="24">Pacient fictiv: Ana Test</text>
    <text x="70" y="345" font-size="24">Medic fictiv: Dr. Demo Ionescu</text>
    <text x="70" y="395" font-size="24">Data documentului: 06.11.2026</text>
    <text x="70" y="510" font-size="30" font-weight="bold">Amlodipina</text>
    <text x="70" y="570" font-size="27">Doza: 5 mg</text>
    <text x="70" y="630" font-size="27">Instructiune: 1 cp dimineata</text>
    <text x="70" y="690" font-size="27">Durata: 30 zile</text>
    <path d="M70 755H830" stroke="#18232f" stroke-width="2"/>
    <text x="70" y="815" font-size="22">Nu sunt specificate ore exacte sau data inceperii.</text>
    <text x="70" y="860" font-size="22">Programul din demo necesita confirmare explicita.</text>
    <text x="70" y="980" font-size="22" font-weight="bold">DATE FICTIVE - FARA VALOARE MEDICALA</text>
  </g>
</svg>
